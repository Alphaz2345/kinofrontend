<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINO — Opret konto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <a class="logo" href="index.html">🎬 KINO</a>
</nav>

<div class="page-wrap-sm" style="margin-top:3rem">
    <a class="back-link" href="index.html">← Tilbage</a>
    <h2 class="page-title">Opret konto</h2>
    <p style="color:var(--text-dim);margin-bottom:1.5rem;font-size:0.9rem">Hurtig booking og billethistorik</p>

    <div class="card">
        <div class="form-group">
            <label class="form-label">Fulde navn</label>
            <input class="form-input" id="regName" placeholder="Lars Larsen">
        </div>
        <div class="form-group">
            <label class="form-label">Telefon</label>
            <input class="form-input" id="regPhone" placeholder="+45 12 34 56 78">
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" id="regEmail" type="email" placeholder="din@email.dk">
        </div>
        <div class="form-group">
            <label class="form-label">Adgangskode</label>
            <input class="form-input" id="regPwd" type="password" placeholder="Mindst 8 tegn">
        </div>
        <button class="btn btn-primary btn-full" style="margin-top:0.5rem" onclick="register()">Opret konto</button>
        <div style="text-align:center;margin-top:1rem">
            <a href="login.html" style="color:var(--text-dim);font-size:0.82rem">Har du allerede en konto? Log ind</a>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script src="js/api.js"></script>
<script>
    async function register() {
        const name  = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const pwd   = document.getElementById('regPwd').value;
        if (!name || !email || !pwd) { showToast('Udfyld alle felter', 'error'); return; }
        try {
            const customer = await CustomerAPI.register(name, phone, email, pwd);
            Session.setCustomer(customer);
            showToast('Konto oprettet!', 'success');
            setTimeout(() => location.href = 'index.html', 1000);
        } catch (e) {
            showToast('Fejl: ' + e.message, 'error');
        }
    }
</script>
</body>
</html>
