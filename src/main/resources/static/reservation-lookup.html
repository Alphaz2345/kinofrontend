<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINO — Mine reservationer</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .res-code { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: var(--gold); letter-spacing: 0.1em; }
        .res-detail { color: var(--text-dim); font-size: 0.85rem; line-height: 2.1; margin: 0.8rem 0 1rem; }
        .res-detail strong { color: var(--text); }
        .res-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        #resCard { display: none; margin-top: 1.5rem; }
    </style>
</head>
<body>

<nav>
    <a class="logo" href="index.html">🎬 KINO</a>
    <div class="nav-links">
        <a class="nav-link" href="index.html">Forside</a>
        <a class="nav-link active" href="reservation-lookup.html">Mine reservationer</a>
    </div>
</nav>

<div class="page-wrap-sm">
    <a class="back-link" href="index.html">← Forside</a>
    <h2 class="page-title">Find reservation</h2>
    <p style="color:var(--text-dim);font-size:0.9rem;margin-bottom:1.5rem">
        Indtast din reservationskode eller telefonnummer.
    </p>

    <div class="form-group">
        <label class="form-label">Reservationskode eller telefon</label>
        <input class="form-input" id="lookupInput" placeholder="F.eks. A3B9F2E1 eller +45 12 34 56 78">
    </div>
    <button class="btn btn-primary btn-full" onclick="lookup()">Søg</button>

    <!-- RESULTAT -->
    <div class="card" id="resCard">
        <div class="res-code" id="resCode"></div>
        <div class="res-detail" id="resDetail"></div>
        <div class="res-actions">
            <button class="btn btn-danger btn-sm" onclick="cancelRes()">✕ Annuller reservation</button>
            <button class="btn btn-primary btn-sm" onclick="convertRes()">→ Konverter til køb</button>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="js/api.js"></script>
<script>
    let currentResId = null;

    async function lookup() {
        const val = document.getElementById('lookupInput').value.trim();
        if (!val) { showToast('Udfyld søgefeltet', 'error'); return; }

        try {
            let reservation;
            // Prøv som kode først, derefter som telefon
            if (val.startsWith('+') || /^\d/.test(val)) {
                const list = await ReservationAPI.findByPhone(val);
                reservation = list[0];
            } else {
                reservation = await ReservationAPI.findByCode(val.toUpperCase());
            }

            if (!reservation) { showToast('Ingen reservation fundet', 'error'); return; }

            currentResId = reservation.id;
            document.getElementById('resCode').textContent = reservation.reservationCode;

            const dt = new Date(reservation.showing?.startTime);
            const statusMap = { PENDING:'Afventer', CONFIRMED:'Bekræftet', CANCELLED:'Annulleret', CONVERTED:'Konverteret' };
            document.getElementById('resDetail').innerHTML = `
        <strong>Film:</strong> ${reservation.showing?.movie?.title ?? '—'}<br>
        <strong>Sal:</strong> ${reservation.showing?.theatre?.name ?? '—'}<br>
        <strong>Tidspunkt:</strong> ${isNaN(dt) ? '—' : dt.toLocaleString('da-DK')}<br>
        <strong>Sæder:</strong> ${reservation.seats?.map(s=>`R${s.rowNumber}·S${s.seatNumber}`).join(', ') ?? '—'}<br>
        <strong>Status:</strong> ${statusMap[reservation.status] ?? reservation.status}<br>
        <strong>Udløber:</strong> ${reservation.expiresAt ? new Date(reservation.expiresAt).toLocaleString('da-DK') : '—'}
      `;
            document.getElementById('resCard').style.display = 'block';
        } catch (e) {
            showToast('Reservation ikke fundet', 'error');
            document.getElementById('resCard').style.display = 'none';
        }
    }

    async function cancelRes() {
        if (!currentResId) return;
        if (!confirm('Er Du sikker på at du vil annullere denne reservation?')) return;
        try {
            await ReservationAPI.cancel(currentResId);
            showToast('Reservation annulleret', 'success');
            document.getElementById('resCard').style.display = 'none';
        } catch (e) {
            showToast('Fejl: ' + e.message, 'error');
        }
    }

    async function convertRes() {
        if (!currentResId) return;
        try {
            await ReservationAPI.convert(currentResId);
            showToast('Konverteret til køb — billet sendes på email', 'success');
            document.getElementById('resCard').style.display = 'none';
        } catch (e) {
            showToast('Fejl: ' + e.message, 'error');
        }
    }
</script>
</body>
</html>
